<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Short fixture</title>
    <style>
      body { margin: 0; font: 16px system-ui; }
      header { position: sticky; top: 0; height: 60px; background: #ffe58a; z-index: 5; }
      .fab { position: fixed; right: 20px; bottom: 20px; width: 52px; height: 52px; border-radius: 50%; background: #e63946; }
      .block { height: 400px; border-bottom: 2px solid #ccc; padding: 10px; box-sizing: border-box; }
      .block:nth-child(even) { background: #f2f6ff; }
    </style>
  </head>
  <body>
    <header>Sticky 顶栏</header>
    <div class="fab"></div>
    <main id="main"></main>
    <script>
      const main = document.getElementById('main');
      for (let i = 0; i < 8; i++) {
        const d = document.createElement('div');
        d.className = 'block';
        d.textContent = '段落 ' + i;
        main.appendChild(d);
      }
    </script>
  </body>
</html>
